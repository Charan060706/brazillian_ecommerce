version: 2

models:
  - name: stg_customers
    description: "Cleaned and renamed list of Olist customers."
    columns:
      - name: customer_key
        description: "Primary key. Unique identifier for a customer's specific order location."
        tests:
          - unique
          - not_null

  - name: stg_orders
    description: "Cleaned e-commerce orders table with explicit timestamps."
    columns:
      - name: order_id
        description: "Primary key. Unique identifier for each order."
        tests:
          - unique
          - not_null
      - name: customer_key
        description: "Foreign key linking back to stg_customers."
        tests:
          - not_null
          - relationships:
              to: 'ref("stg_customers")'
              field: customer_key
      - name: order_status
        description: "Current full fillment status of the order."
        tests:
          - accepted_values:
               values: ['delivered','shipped','canceled','invoiced','processing','created','approved','unavailable']
  - name: stg_order_items
    description: "Line item details per order containing item sequences, prices, and freight values."
    columns:
       - name: order_id
         description: "Foreign key linking to the stg_orders"
         tests:
           - not_null 
           - relationships:
               to: 'ref("stg_orders")'
               field: order_id
  - name: stg_payments
    description: "Payment transactions per order, including payment methods and installment counts."
    columns:
      - name: order_id
        description: "foreign key linking to stg_orders"
        tests:
           - not_null
           - relationships:
               to: 'ref("stg_orders")'
               field: order_id
      - name: payment_type
        description: "Method of payment used (credit_card, boleto, voucher, debit_card)."
        tests:
          - accepted_values:
               values: ['credit_card','boleto','voucher','debit_card' , 'not_defined']
  - name: stg_sellers
    description: "Seller directory with geographical location details."
    columns:
       - name: seller_id
         description: "Primary key for sellers"
         tests:
           - unique
           - not_null
  - name: stg_reviews
    description: "Customer feedback scores and submission timestamps."
    columns:
      - name: review_id
        description: "Unique identifier for each review."
        tests:
          - not_null
      - name: review_score
        description: "Rating given by the customer (1 to 5 stars)."
  - name: stg_geolocation
    descripiton: "Brazilian zip code prefix mapping to latitude, longitude, and state."
  - name: stg_translations
    descripiton: "Translation lookup map from Portuguese product category names to English."
    columns:
      - name: product_category_name
        tests:
          - unique
          - not_null
  - name: stg_products
    descripiton: "Product catalog attributes formatted with translated category names."
    columns:
      - name: product_id
        description: "Primary Key for products"
        tests:
          - unique 
          - not_null
      - name: product_category_name
        description: "each product ordered by a customer is represented with their respective category"
        tests:
           - not_null



   

 