name: 'olist_analytics'
version: '1.0.0'
config-version: 2

# Profile linking to profiles.yml
profile: 'olist_analytics'

# Project paths
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# Directories removed by `dbt clean`
clean-targets:
  - "target"
  - "dbt_packages"

# Model Configurations
models:
  olist_analytics:
    # Staging Layer: Lightweight transformations configured as views
    staging:
      +materialized: view
      +schema: staging

    # Marts Layer: Dimensional modeling (Gold layer) materialized as tables
    marts:
      +materialized: table
      +schema: marts